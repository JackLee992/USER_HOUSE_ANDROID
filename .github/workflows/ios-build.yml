name: iOS Simulator build
on:
  workflow_dispatch:
  pull_request:
    paths: ['ios/**', 'scripts/*ios*', 'src/**', 'standalone/**', 'assets/**', 'locales/**', '.github/workflows/ios-build.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project generator
        run: brew install xcodegen
      - name: Build unsigned Simulator application
        run: scripts/build-ios.sh build
      - name: Preserve Simulator executable permissions
        run: ditto -c -k --keepParent ios/DerivedData/Build/Products/Debug-iphonesimulator/Nookcade.app ios/build/Nookcade-Simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Nookcade-iOS-Simulator
          path: ios/build/Nookcade-Simulator.zip
          retention-days: 14
