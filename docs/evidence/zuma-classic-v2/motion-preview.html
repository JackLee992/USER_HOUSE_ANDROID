<!doctype html><meta charset="utf-8"><title>Zuma mouth-motion atlas QA</title>
<style>body{margin:0;background:#102e2c;color:#f3e7c3;font:16px system-ui}h1{font-size:22px;margin:20px}canvas{display:block;margin:20px}</style><h1>Mouth animation · closed / open / gulp · isolated skull jaw</h1><canvas width="1100" height="610"></canvas>
<script type="module">
const i=new Image();i.src='/assets/game-art/zuma/classic-v2/mouth-motion.png';await i.decode();
const raw=document.createElement('canvas');raw.width=i.width;raw.height=i.height;const g=raw.getContext('2d',{willReadFrequently:true});g.drawImage(i,0,0);const d=g.getImageData(0,0,i.width,i.height).data;
let zero=0,partial=0,min=255,max=0;for(let n=3;n<d.length;n+=4){const a=d[n];min=Math.min(min,a);max=Math.max(max,a);if(a===0)zero++;else if(a<255)partial++}
const cells=[[0,0,627,627],[627,0,627,627],[0,627,627,627],[627,627,627,627]];
const bounds=cells.map(([x,y,w,h])=>{let x0=Infinity,y0=Infinity,x1=-1,y1=-1;for(let yy=y;yy<y+h;yy++)for(let xx=x;xx<x+w;xx++)if(d[(yy*i.width+xx)*4+3]>128){x0=Math.min(x0,xx);y0=Math.min(y0,yy);x1=Math.max(x1,xx);y1=Math.max(y1,yy)}return[x0,y0,x1-x0+1,y1-y0+1]});
const motion=(await(await fetch('/assets/game-art/zuma/manifest.json')).json()).classic.motion;const sourceRects=[...motion.frogFrames,motion.skullJaw];
const c=document.querySelector('canvas').getContext('2d');c.font='16px system-ui';
for(let row=0;row<2;row++)for(let col=0;col<4;col++){const x=10+col*270,y=10+row*290;c.fillStyle=row?'#f7eed8':'#142629';c.fillRect(x,y,250,250);const rect=sourceRects[col],height=230*rect[3]/rect[2];c.drawImage(i,...rect,x+10,y+10+(230-height)/2,230,height);c.fillStyle='#f3e7c3';c.fillText(['closed','open','gulp','skull jaw'][col],x+10,y+274)}
window.zumaAlpha={file:'mouth-motion.png',width:i.width,height:i.height,alphaMin:min,alphaMax:max,transparentPixels:zero,transparentFraction:zero/(i.width*i.height),partialPixels:partial,corners:[d[3],d[(i.width-1)*4+3],d[((i.height-1)*i.width)*4+3],d[d.length-1]],bounds,cells,sourceRects};window.iconsReady=true;
</script>
