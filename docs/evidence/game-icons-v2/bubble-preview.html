<!doctype html><meta charset="utf-8"><title>Bubble source QA</title><style>body{font:16px system-ui;background:#f7f2e9;margin:28px;color:#17273b}section{padding:20px;margin-bottom:20px;display:flex;gap:32px}.dark{background:#142237}.light{background:white}canvas{display:block}.item{text-align:center;min-width:72px}.label{margin-top:8px;font-size:11px}.dark .label{color:white}</style><h1>Actual bubble sprite rendering · 24 / 48 px</h1><div id="out"></div><script type="module">
import {drawGameSprite,preloadGameArt} from '/standalone/game-art.js';
await preloadGameArt(window);const results=[];
for(const bg of ['light','dark'])for(const size of [24,48]){const section=document.createElement('section');section.className=bg;for(let i=0;i<6;i++){const item=document.createElement('div');item.className='item';const c=document.createElement('canvas');c.width=c.height=size;const ctx=c.getContext('2d');const drawn=drawGameSprite(ctx,'bubbles',i,0,0,size,size);const pixels=ctx.getImageData(0,0,size,size).data;const at=(x,y)=>pixels[(y*size+x)*4+3];results.push({bg,size,index:i,drawn,cornerAlpha:[at(0,0),at(size-1,0),at(0,size-1),at(size-1,size-1)],edgeMidAlpha:[at(Math.floor(size/2),0),at(size-1,Math.floor(size/2)),at(Math.floor(size/2),size-1),at(0,Math.floor(size/2))]});item.append(c);const label=document.createElement('div');label.className='label';label.textContent=['Red','Blue','Green','Gold','Purple','Orange'][i]+' '+size+' px';item.append(label);section.append(item)}document.querySelector('#out').append(section)}window.bubbleQA=results;window.iconsReady=true;
</script>
